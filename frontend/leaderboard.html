<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard — OpenTrack</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/leaderboard.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><span class="logo-icon">⟨/⟩</span><span class="logo-text">OpenTrack</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="leaderboard.html" class="active">Leaderboard</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>
    <main>
        <div class="page-header">
            <h1>🏆 Contributor Leaderboard</h1>
            <p class="subtitle">Ranked by contribution score across commits, PRs, issues, and reviews</p>
        </div>
        <div class="filters">
            <select id="filter-period">
                <option value="all">All Time</option>
                <option value="month">This Month</option>
                <option value="week">This Week</option>
            </select>
            <input type="text" id="search-input" placeholder="Search contributor..." />
        </div>
        <div class="podium" id="podium"></div>
        <table class="leaderboard-table" id="leaderboard-table">
            <thead>
                <tr>
                    <th>Rank</th><th>Contributor</th><th>Score</th>
                    <th>Commits</th><th>PRs</th><th>Issues</th><th>Reviews</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <tr><td colspan="7" style="text-align:center;padding:2rem;color:#8b949e">Loading...</td></tr>
            </tbody>
        </table>
        <div class="pagination" id="pagination"></div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/leaderboard.js"></script>
</body>
</html>
