<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — OpenTrack</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><span class="logo-icon">⟨/⟩</span><span class="logo-text">OpenTrack</span></div>
    </nav>
    <main class="auth-main">
        <div class="auth-card">
            <h1>Create Account</h1>
            <p class="auth-sub">Join OpenTrack and start tracking your contributions</p>
            <form id="register-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Choose a username" required minlength="3" />
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Your email address" required />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Min 8 characters" required minlength="8" />
                </div>
                <div class="form-group">
                    <label for="github-username">GitHub Username <span class="optional">(optional)</span></label>
                    <input type="text" id="github-username" placeholder="Your GitHub handle" />
                </div>
                <div id="error-msg" class="error-msg"></div>
                <button type="submit" class="btn btn-primary w-full">Create Account</button>
            </form>
            <p class="auth-link">Already have an account? <a href="login.html">Sign in</a></p>
        </div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
