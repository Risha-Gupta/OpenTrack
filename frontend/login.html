<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — OpenTrack</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><span class="logo-icon">⟨/⟩</span><span class="logo-text">OpenTrack</span></div>
    </nav>
    <main class="auth-main">
        <div class="auth-card">
            <h1>Sign In</h1>
            <p class="auth-sub">Track your open source journey</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required />
                </div>
                <div id="error-msg" class="error-msg"></div>
                <button type="submit" class="btn btn-primary w-full">Sign In</button>
            </form>
            <p class="auth-link">Don't have an account? <a href="register.html">Sign up</a></p>
        </div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
