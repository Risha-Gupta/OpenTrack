spring.application.name=opentrack
server.port=8080
server.servlet.context-path=/api/v1

spring.datasource.url=jdbc:mysql://localhost:3306/opentrack_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

github.api.base-url=https://api.github.com
github.api.token=${GITHUB_TOKEN:}
github.api.rate-limit-pause-ms=1000

jwt.secret=${JWT_SECRET:opentrack-super-secret-key-change-in-production-min-256-bits}
jwt.expiration-ms=86400000

logging.level.com.opentrack=INFO
logging.level.org.springframework.security=WARN

opentrack.sync.cron=0 0 2 * * *